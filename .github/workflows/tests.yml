name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Runs the real test command, not a stand-in for it: pinned exact
      # versions (via --with) so CI matches the versions verified locally,
      # and --no-project so uv doesn't look for a pyproject.toml this repo
      # doesn't have. pytest.ini supplies pythonpath, so no PYTHONPATH here.
      - name: Run tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 uv run --no-project --python 3.12 \
            --with pytest --with Flask==3.1.3 --with Werkzeug==3.1.8 \
            --with pydantic==2.13.4 --with pydantic-settings==2.14.2 \
            --with aiosqlite==0.22.1 --with python-dotenv==1.2.2 \
            --with Markdown==3.10.2 --with bleach==6.4.0 \
            --with APScheduler==3.11.3 \
            python -m pytest -q tests
